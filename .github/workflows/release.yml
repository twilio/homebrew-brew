name: Homebrew Release
on:
  workflow_dispatch:
    inputs:
      formula:
        description: 'Formula to release Homebrew'
        default: twilio
      version:
        description: 'Release version - Same as CLI version'
        required: true
      sha:
        description: 'SHA of tar file created by oclif'
      pre-release:
        description: 'If it is a prerelease send true as input'
        default: 'false'

jobs:
  update:
    runs-on: ubuntu-x64
    steps:
      - name: Checkout to homebrew
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Update Home Brew with latest sha and version
        # GH_TOKEN is needed because the formula update now opens a PR rather
        # than pushing to main. Inputs go through env instead of being
        # interpolated into the command, so a value containing shell
        # metacharacters cannot inject commands into a step holding a token.
        run: |
          source .github/scripts/update-formula.sh "$FORMULA" "$VERSION" "$SHA"
        env:
          FORMULA: ${{ github.event.inputs.formula }}
          VERSION: ${{ github.event.inputs.version }}
          SHA: ${{ github.event.inputs.sha }}
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
  release:
    runs-on: ubuntu-x64
    needs: [update]
    permissions:
      contents: write
    steps:
      - name: Checkout to homebrew
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: git pull
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=()
          [ "${{ github.event.inputs.pre-release }}" = "true" ] && ARGS+=(--prerelease)
          gh release create "${{ github.event.inputs.version }}" --generate-notes "${ARGS[@]}"