name: Homebrew Release
on:
  # The formula update lands as a PR, so the GitHub release is cut when that
  # PR merges rather than in the dispatch run. Tagging in the dispatch run
  # would point the tag at a commit that does not contain the formula update.
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      formula:
        description: 'Formula to release Homebrew'
        default: twilio
      version:
        description: 'Release version - Same as CLI version'
        required: true
      sha:
        description: 'SHA of tar file created by oclif'
      pre-release:
        description: 'If it is a prerelease send true as input'
        default: 'false'

jobs:
  update:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-x64
    steps:
      - name: Checkout to homebrew
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
      - name: Update Home Brew with latest sha and version
        run: |
          source .github/scripts/update-formula.sh "$FORMULA" "$VERSION" "$SHA"
        env:
          FORMULA: ${{ github.event.inputs.formula }}
          VERSION: ${{ github.event.inputs.version }}
          SHA: ${{ github.event.inputs.sha }}
          GH_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
  # Runs on the merge of a formula PR, so the tag lands on a commit that
  # actually contains the formula update.
  release:
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.head_commit.message, 'Release ')
    runs-on: ubuntu-x64
    permissions:
      contents: write
    steps:
      - name: Checkout to homebrew
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Create GitHub Release
        # The dispatch inputs are gone by now, so the version comes from the
        # commit subject update-formula.sh wrote ("Release <version>"). A
        # squash merge appends " (#N)", which is stripped here.
        #
        # pre-release was an explicit dispatch input; it is derived from the
        # version instead, treating any semver pre-release (7.0.0-rc.1,
        # 7.0.0-draft.2) as a pre-release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          subject=$(printf '%s' "$COMMIT_MESSAGE" | head -1)
          version=$(printf '%s' "$subject" | sed -E 's/^Release ([^ ]+).*/\1/')
          if [ -z "$version" ] || [ "$version" = "$subject" ]; then
            echo "::error::Could not parse a version from: $subject"
            exit 1
          fi
          echo "Releasing $version"
          ARGS=()
          case "$version" in *-*) ARGS+=(--prerelease) ;; esac
          gh release create "$version" --generate-notes "${ARGS[@]}"
